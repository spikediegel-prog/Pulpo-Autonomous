[project]
name = "pulpo-autonomous"
version = "0.1.0"
description = "A governed execution kernel for autonomous robots, vehicles, and spacecraft"
requires-python = ">=3.11"

[project.optional-dependencies]
authority = ["cryptography==50.0.1"]
mcp = ["mcp[cli]>=2,<3"]

[project.scripts]
pulpo-git-clarity = "pulpo.git_clarity:main"
pulpo-mcp-tunnel = "pulpo.mcp_tunnel:main"

[tool.setuptools]
packages = ["pulpo"]
